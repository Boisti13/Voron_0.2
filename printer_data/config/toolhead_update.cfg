#####################################################################
#   Toolhead (EBB36) firmware update via Katapult over CAN
#   Script: scripts/update_toolhead.sh   Log: logs/update_toolhead.log
#####################################################################
# UPDATE_TOOLHEAD            flash only if the toolhead firmware is outdated
# UPDATE_TOOLHEAD FORCE=1    reflash even if versions match
#
# Klipper is stopped while flashing and restarted afterwards, so the
# web UI will briefly disconnect. Refused while printing or paused.

[gcode_shell_command update_toolhead]
command: /home/biqu/printer_data/config/scripts/update_toolhead.sh --detach
timeout: 10.
verbose: True

[gcode_macro UPDATE_TOOLHEAD]
description: Build and flash the EBB36 toolhead firmware via Katapult
gcode:
    {% set state = printer.print_stats.state %}
    {% if state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="UPDATE_TOOLHEAD: not allowed while {state}"
    {% else %}
        {% set ver = printer["mcu EBBCan"].mcu_version %}
        RESPOND MSG="Toolhead firmware: {ver} - starting update (Klipper restarts if it flashes)"
        {% if params.FORCE|default(0)|int == 1 %}
            RUN_SHELL_COMMAND CMD=update_toolhead PARAMS=--force
        {% else %}
            RUN_SHELL_COMMAND CMD=update_toolhead
        {% endif %}
    {% endif %}
